# Builds the exe on GitHub's Windows machines. For a tag like v0.1.0-preview the exe is
# attached to a GitHub release, so everyone can see it was built from this code.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the engine script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\engine\engine.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Build
        shell: cmd
        run: build.bat nopause
      - uses: actions/upload-artifact@v4
        with:
          name: AFK-Realm
          path: AFK-Realm.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AFK-Realm.exe
          body_path: RELEASE_NOTES.md
          # Tags with a suffix (v0.1.0-preview, v0.2.0-beta) are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The cross-platform build (app/): a local web server with the page in an app window or the browser.
  # Self-contained single files, so neither .NET nor anything else has to be installed first.
  web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, file: AFK-Realm.exe, asset: AFK-Realm-web.exe }
          - { os: ubuntu-latest, rid: linux-x64, file: AFK-Realm, asset: AFK-Realm-linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64, file: AFK-Realm, asset: AFK-Realm-linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: bash
        run: |
          dotnet publish app/AfkRealm.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -o out
          mv "out/${{ matrix.file }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
          prerelease: ${{ contains(github.ref_name, '-') }}
